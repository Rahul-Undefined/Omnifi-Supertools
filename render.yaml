# Render Blueprint: deploys Omnifi SuperTools as a free web service.
# In Render: New + -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: omnifi-supertools
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SESSION_SECRET
        generateValue: true
      # AI provider: groq | grok | anthropic | gemini | openai | openai-compatible. Keys are pasted in the Render dashboard, never committed.
      # groq = groq.com (keys gsk_...), grok = x.ai (keys xai-...): different companies.
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      # Keep the whole team inside the provider's free allowance: lite model for short tasks, shared pacing, 7-day answer cache.
      - key: AI_MODEL_LITE
        value: openai/gpt-oss-20b
      - key: AI_GLOBAL_PER_MIN
        value: "6"
      - key: AI_GLOBAL_PER_DAY
        value: "200"
      - key: AI_CACHE_DAYS
        value: "7"
      # Personal allowance: 15 AI requests per 3 hours per signed-in person (cache hits are free).
      - key: AI_USER_QUOTA
        value: "15"
      - key: AI_USER_WINDOW_HOURS
        value: "3"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Steps Recorder desktop app: paste the same token that is baked into the app build (Branding/AppConfig.cs).
      # 5 AI-written SOPs per 5 hours per computer; at most 40 screenshots per SOP are forwarded to the model.
      - key: STEPS_RECORDER_TOKEN
        sync: false
      - key: STEPS_RECORDER_QUOTA
        value: "5"
      - key: STEPS_RECORDER_WINDOW_HOURS
        value: "5"
      - key: STEPS_RECORDER_MAX_IMAGES
        value: "24"
      # Optional: a faster model just for SOP writing (e.g. openai/gpt-oss-20b). Empty = AI_MODEL.
      - key: STEPS_RECORDER_MODEL
        sync: false
      # REQUIRED in production: at least one sign-in method must exist (ADMIN_PASSWORD, USERS_JSON, Microsoft,
      # or header SSO with AUTH_PROXY_SECRET). Without one the app answers 503 instead of running open.
      - key: ADMIN_PASSWORD
        sync: false
      # Render terminates TLS and sets X-Forwarded-For; trust it for per-IP rate limits.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Daily quotas per signed-in user (AI calls, outbound web-tool requests). 0 disables.
      - key: QUOTA_AI_PER_DAY
        value: "300"
      - key: QUOTA_WEB_PER_DAY
        value: "2000"
      # Retention (days) for usage telemetry, audit log, team feedback and synced preferences.
      - key: RETENTION_USAGE_DAYS
        value: "90"
      - key: RETENTION_AUDIT_DAYS
        value: "180"
      - key: RETENTION_FEEDBACK_DAYS
        value: "365"
      - key: RETENTION_PREFS_DAYS
        value: "365"
      # Microsoft 365 sign-in (Entra ID app registration). See docs/DEPLOYMENT.md.
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AUTH_ALLOWED_DOMAINS
        value: myomnifi.com
      - key: APP_URL
        value: https://omnifi-supertools.onrender.com
      # Keep the free instance awake 24x7 by pinging our own URL every 10 minutes (one service fits in 750 free hours/month).
      - key: KEEP_AWAKE
        value: "true"
      - key: KEEP_AWAKE_MINUTES
        value: "10"
      # Optional: free PostgreSQL (e.g. Neon) so usage stats and team feedback survive redeploys.
      # GitHub-backed persistence (no database needed): private data repo + fine-grained token (Contents: write on that repo only).
      - key: GITHUB_DATA_REPO
        value: Rahul-Undefined/Omnifi-Supertools-Data
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: GITHUB_DATA_BRANCH
        value: main
      - key: BACKUP_EVERY_MINUTES
        value: "60"
      - key: BACKUP_EXCEL_MINUTE_IST
        value: "1410"
      - key: DATABASE_URL
        sync: false
