# Render Blueprint: deploys Omnifi SuperTools as a free web service.
# In Render: New + -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: omnifi-supertools
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SESSION_SECRET
        generateValue: true
      # AI provider: anthropic | gemini | openai | openai-compatible. Keys are pasted in the Render dashboard, never committed.
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # REQUIRED in production: at least one sign-in method must exist (ADMIN_PASSWORD, USERS_JSON, Microsoft,
      # or header SSO with AUTH_PROXY_SECRET). Without one the app answers 503 instead of running open.
      - key: ADMIN_PASSWORD
        sync: false
      # Render terminates TLS and sets X-Forwarded-For; trust it for per-IP rate limits.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      # Daily quotas per signed-in user (AI calls, outbound web-tool requests). 0 disables.
      - key: QUOTA_AI_PER_DAY
        value: "300"
      - key: QUOTA_WEB_PER_DAY
        value: "2000"
      # Retention (days) for usage telemetry, audit log, team feedback and synced preferences.
      - key: RETENTION_USAGE_DAYS
        value: "90"
      - key: RETENTION_AUDIT_DAYS
        value: "180"
      - key: RETENTION_FEEDBACK_DAYS
        value: "365"
      - key: RETENTION_PREFS_DAYS
        value: "365"
      # Microsoft 365 sign-in (Entra ID app registration). See docs/DEPLOYMENT.md.
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AUTH_ALLOWED_DOMAINS
        value: myomnifi.com
      - key: APP_URL
        value: https://omnifi-supertools.onrender.com
      # Optional: free PostgreSQL (e.g. Neon) so usage stats and team feedback survive redeploys.
      - key: DATABASE_URL
        sync: false
