# Render Blueprint: deploys Omnifi SuperTools as a free web service.
# In Render: New + -> Blueprint -> pick this repository -> Apply.
services:
  - type: web
    name: omnifi-supertools
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_MODEL
        value: claude-sonnet-5
      # Paste your key in the Render dashboard (Environment tab); never commit it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Admin password for /admin (set in the Render dashboard; the admin page is open to everyone until it is set).
      - key: ADMIN_PASSWORD
        sync: false
      # Microsoft 365 sign-in (Entra ID app registration). See docs/DEPLOYMENT.md.
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AUTH_ALLOWED_DOMAINS
        value: myomnifi.com
      - key: APP_URL
        value: https://omnifi-supertools.onrender.com
      # Video downloader: optional cookies.txt content / proxy for sites that block cloud IPs (see docs/DEPLOYMENT.md)
      - key: YTDLP_COOKIES
        sync: false
      - key: YTDLP_PROXY
        sync: false
      # Optional: free PostgreSQL (e.g. Neon) so usage stats and team feedback survive redeploys.
      - key: DATABASE_URL
        sync: false
