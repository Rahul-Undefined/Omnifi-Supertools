# Backup keep-awake. The app now pings itself every 10 minutes 24x7
# (src/instrumentation.ts, KEEP_AWAKE). This workflow only matters if the
# instance was stopped externally (e.g. Render maintenance): it wakes it
# during working hours so the self-ping can take over again.
# Private repos get 2,000 free Actions minutes a month; this uses about 350.
name: Keep Render awake
on:
  schedule:
    - cron: "*/30 5-16 * * 1-5"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://omnifi-supertools.onrender.com/api/health)
          echo "health -> $code"
          test "$code" = "200"
