name: omnifi-supertools

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://supertools:${POSTGRES_PASSWORD:-supertools}@db:5432/supertools
      REDIS_URL: redis://redis:6379
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supertools
      POSTGRES_USER: supertools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supertools}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertools"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Reserved for a future server-side job queue (LibreOffice/FFmpeg workers).
  # Nothing in the current build requires it; safe to remove.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  app-data:
  pg-data:
